spring.datasource.url=jdbc:postgresql://localhost:5432/secure_api_test
spring.datasource.username=secure_api_test_user
spring.datasource.password=${TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.bootstrap.enabled=false

app.jwt.issuer=secure-api-test
app.jwt.ttl=15m