name: API security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: secure_api_test
          POSTGRES_USER: secure_api_test_user
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_api_test_user -d secure_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: bash ./mvnw -B --no-transfer-progress test
        env:
          TEST_DB_PASSWORD: ci-only-disposable-password

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  sast:
    name: SAST - SpotBugs and FindSecBugs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run static security analysis
        run: bash ./mvnw -B --no-transfer-progress compile spotbugs:check

      - name: Save SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            target/spotbugs*.xml
            target/spotbugs*.html
          if-no-files-found: warn
  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify NVD API access
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.error

          key = os.environ.get("NVD_API_KEY", "")

          if not key:
              sys.exit("NVD_API_KEY is empty or unavailable")

          if key != key.strip():
              sys.exit("NVD_API_KEY contains leading or trailing whitespace")

          request = urllib.request.Request(
              "https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1",
              headers={"apiKey": key}
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(f"NVD direct request: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              message = error.headers.get("message", "No explanation from NVD")
              message = message.replace(key, "[REDACTED]")
              sys.exit(
                  f"NVD direct request: HTTP {error.code}; message: {message}"
              )
          except urllib.error.URLError:
              sys.exit("NVD direct request: network or TLS error")
          PY

      - name: Check dependencies for known vulnerabilities
        run: bash ./mvnw -B --no-transfer-progress dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn